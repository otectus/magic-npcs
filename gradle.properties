org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Java 17 required for MC 1.20.1

minecraft_version=1.20.1
forge_version=47.4.16
mod_id=magicnpcs
mod_name=Magic NPCs
mod_version=0.7.0
mod_group=com.otectus.magicnpcs
mod_authors=otectus
mod_license=GNU GPLv3

# CurseForge dependencies (1.20.1)
# Format: curse.maven:<slug>-<projectId>:<fileId>
# Iron's is a compile-time dependency (compileOnly, deobf). This file id resolves to 1.20.1-3.16.3,
# which is also the jar the 0.6.2 mob-cast manifest (SpellManifest.java) was derived from. Keep the
# two in step: bumping this without regenerating the manifest would let the mod claim verified support
# for spells it has never seen.
irons_spellbooks_project=irons-spells-n-spellbooks-855414
irons_spellbooks_file=7402504
irons_spellbooks_compile=1.20.1-3.16.3
# Dev-runtime Iron's jar in libs/ (-PdevRuntime). Matches the user's pack.
irons_spellbooks_runtime=1.20.1-3.16.1

# Villager Recruits — compiled against the local production jar (libs/recruits-<version>.jar)
# via flatDir + fg.deobf. All Rights Reserved: compileOnly only, never bundled.
recruits_jar_version=1.20.1-1.15.2

# Easy NPC — compileOnly soft dependency (MIT for code; assets are excluded from that grant, and
# none are used here). Easy NPC 7.x is published as THREE separate mods: core (`easy_npc`, the
# classes), config-ui (`easy_npc_config_ui`) and a dependency-only bundle. Magic NPCs compiles
# against CORE only — the bundle ships no classes, and config-ui is optional for end users.
#
# Pinned by CurseForge FILE id, not by version string, on purpose: every loader shares the version
# number `7.11.0`, so `maven.modrinth:easy-npc-core:7.11.0` resolves to the Fabric jar. A file id
# names exactly one loader's build. There is no public Maven for Easy NPC — the
# `de.markusbordihn.easynpc:easy_npc-forge-1.20.1` coordinates in its DEVELOPMENT.md are
# mavenLocal-only, used for its own inter-module build.
#
# Format: curse.maven:<slug>-<projectId>:<fileId>
easy_npc_project=easy-npc-core-1308987
easy_npc_file=8779221
easy_npc_compile=1.20.1-7.11.0

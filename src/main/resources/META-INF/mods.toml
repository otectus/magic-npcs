modLoader="javafml"
loaderVersion="[47,)"
license="GNU GPLv3"

[[mods]]
modId="magicnpcs"
version="${version}"
displayName="Magic NPCs"
description='''
Lets NPC mobs cast spells from Iron's Spells 'n Spellbooks. A datapack-driven
casting framework that works on any mob — a loadout JSON is the only opt-in, no
tags and no code — with first-class
support for Villager Recruits. Soft-depends on Iron's Spellbooks and Recruits —
loads cleanly if either is absent.
'''
authors="otectus"

[[dependencies.magicnpcs]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.magicnpcs]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

# Soft-dep. The range is the range Magic NPCs has actually been built and checked
# against: the mob-cast manifest in SpellManifest.java was derived from the Iron's
# 3.16.x bytecode, and 3.15.x shares the same cast lifecycle and spell set. A future
# 3.17 may add spells or change the lifecycle, and this build would then claim support
# for spells it has never seen — so the range ends where the verification does rather
# than optimistically admitting everything below 4.0.
[[dependencies.magicnpcs]]
modId="irons_spellbooks"
mandatory=false
versionRange="[1.20.1-3.15.0,1.20.1-3.17.0)"
ordering="AFTER"
side="BOTH"

# Soft-dep. The Recruits adapter compiles against the Recruits jar but is fully optional at runtime.
# Narrowed from [1.0,) in 0.6.3: the adapter now reads the Recruits command system
# (getShouldHoldPos/getHoldPos/getShouldFollow/getShouldMovePos and the formation fields) to decide
# how far a casting recruit may reposition, where before it used only getXpLevel/getState/
# shouldAttack. That is a much larger surface to assume of an unknown build, and the README has
# always claimed 1.15.0+ anyway — so the range now says what was actually tested.
[[dependencies.magicnpcs]]
modId="recruits"
mandatory=false
versionRange="[1.15.0,)"
ordering="AFTER"
side="BOTH"

# Soft-dep on Easy NPC's CORE module. Easy NPC 7.x is three separately published mods; `easy_npc` is
# the one that owns the classes this integration compiles against. The optional configuration-UI
# module (`easy_npc_config_ui`) is deliberately NOT declared: nothing here needs it, and a core-only
# install must stay fully supported.
#
# The range is narrow because Easy NPC says so itself. Its api/package-info.java states the API "is
# currently in development" and that "breaking changes may occur in minor versions during the
# experimental phase" — this build was written against 7.11.0's ObjectiveRegistry, ActionRegistry,
# ConditionRegistry and EasyNPCEventRegistry, and admitting an unbounded range would be claiming
# support for shapes it has never seen.
[[dependencies.magicnpcs]]
modId="easy_npc"
mandatory=false
versionRange="[7.11,8.0)"
ordering="AFTER"
side="BOTH"

# CustomNPCs — optional. Magic NPCs compiles against the noppes.npcs.api.* public API only, and the
# bridge additionally refuses to activate unless the detected version is on
# CustomNpcsCompat.SUPPORTED_VERSIONS. The range here is therefore deliberately broad: it exists to
# order loading, while the actual "is this build supported" decision is made at runtime, where the
# answer can be reported to the operator instead of stopping the game from starting.
[[dependencies.magicnpcs]]
modId="customnpcs"
mandatory=false
versionRange="[1.20.1,1.21)"
ordering="AFTER"
side="BOTH"

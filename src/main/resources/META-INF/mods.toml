modLoader="javafml"
loaderVersion="[47,)"
license="GNU GPLv3"

[[mods]]
modId="magicnpcs"
version="${version}"
displayName="Magic NPCs"
description='''
Lets NPC mobs cast spells from Iron's Spells 'n Spellbooks. A tag-driven,
datapack-configurable casting framework that works on any mob, with first-class
support for Villager Recruits. Soft-depends on Iron's Spellbooks and Recruits —
loads cleanly if either is absent.
'''
authors="otectus"

[[dependencies.magicnpcs]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.magicnpcs]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

# Soft-dep. Compile-time pin lives in gradle.properties; this runtime range is
# loose so 3.16+ Iron's releases within 1.20.1 are not blocked at load.
[[dependencies.magicnpcs]]
modId="irons_spellbooks"
mandatory=false
versionRange="[1.20.1-3.15.0,1.20.1-4.0.0)"
ordering="AFTER"
side="BOTH"

# Soft-dep. The Recruits adapter compiles against the Recruits jar but is fully optional at runtime.
[[dependencies.magicnpcs]]
modId="recruits"
mandatory=false
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

# Mixin config. The single recruit mixin is plugin-gated to apply only when BOTH
# Iron's Spellbooks and Recruits are present (required=false → graceful skip otherwise).
[[mixins]]
config="magicnpcs.mixins.json"

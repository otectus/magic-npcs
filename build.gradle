plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group
version = mod_version
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Mirrors the ars-n-spells Iron's-integration sibling (same loader + Iron's dep).
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            // 3rd-party production mods (Iron's) ship SRG mixin refmaps; in the named dev runtime,
            // have Mixin remap them via the runtime naming service so their @Injects resolve.
            property 'mixin.env.remapRefMap', 'true'
            // …and point Mixin at ForgeGradle's SRG→named mapping so SRG refmap entries (e.g. Iron's
            // EntityMixin targeting m_7307_/isAlliedTo) resolve against the named runtime classes.
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                magicnpcs {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }

        // Headless gameplay tests (Phase 6). Gated on the magicnpcs namespace so
        // other mods' gametests do not run.
        gameTestServer {
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', 'magicnpcs'
            // Honest positive profiles (roadmap MN-015). With no profile selected the integration
            // tests skip when their host mod is absent, which is the right behaviour for the offline
            // smoke run and the wrong behaviour for a run that claims an integration works. Naming a
            // profile turns every test that needs one of its mods into a REQUIRED test that fails,
            // with the reason, when the host is not actually there.
            if (project.hasProperty('testRuntimeProfile') || project.hasProperty('positiveIntegration')) {
                property 'magicnpcs.positiveProfile', selectedPositiveProfile()
                property 'magicnpcs.requiredMods', selectedPositiveProfileMods().join(',')
                property 'magicnpcs.gametestReport',
                        project.file("${project.buildDir}/reports/gametest/positive-profile.properties").absolutePath
            }
        }

        // Data generation (./gradlew runData): writes the shipped loadouts + item tags
        // to src/generated/resources. Vanilla-only providers, so it runs without Iron's.
        data {
            args '--mod', 'magicnpcs', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

// Generated data (runData output) ships in the jar alongside hand-authored resources.
// The datagen .cache folder is build metadata only — never ship it.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

// The Villager Recruits jar is All Rights Reserved, so it is never committed — it has to be dropped
// into libs/ by hand. Resolve the path once; the dependency block and the compileJava guard below
// both key off whether it is actually there.
def recruitsJar = file("libs/recruits-${recruits_jar_version}.jar")

// The CustomNPCs GBPort build is likewise not on any Maven, so it is dropped into libs/ by hand.
// Same treatment as Recruits, plus a SHA-256 check: several rehosts publish jars under this exact
// file name, and compiling against the wrong one fails at runtime rather than at build time.
def customNpcsJar = file("libs/${customnpcs_jar_artifact}-${customnpcs_jar_version}.jar")

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    // Modrinth maven — dev-runtime companions (GeckoLib/Curios/PlayerAnimator) by semantic version.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Local Recruits jar lives in libs/; flatDir lets ForgeGradle deobf-remap it
    // (fg.deobf cannot remap files(...) self-resolving deps).
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Iron's Spellbooks is a soft dependency: compile against it, do NOT bundle it.
    compileOnly fg.deobf("curse.maven:${irons_spellbooks_project}:${irons_spellbooks_file}")

    // Easy NPC is a soft dependency: compile against the CurseForge "Easy NPC: Core" jar, do NOT
    // bundle it. Core is the module that actually ships classes (the bundle is dependency-only), and
    // its jar is reobfuscated, so fg.deobf is required. See gradle.properties for why this is pinned
    // by file id rather than by version string.
    compileOnly fg.deobf("curse.maven:${easy_npc_project}:${easy_npc_file}")

    // Villager Recruits is a soft dependency: compile against the local jar (libs/), do NOT bundle
    // it (All Rights Reserved). flatDir + fg.deobf remaps it to the workspace mappings.
    // The jar is gitignored, so a fresh clone does not have it — declare the dependency only when it
    // is actually present and let the compileJava guard below explain the situation, instead of
    // failing with Gradle's opaque "Could not resolve blank:recruits".
    if (recruitsJar.exists()) {
        compileOnly fg.deobf("blank:recruits:${recruits_jar_version}")
    }

    // CustomNPCs is a soft dependency compiled against the local GBPort jar (libs/), never bundled.
    // flatDir resolves 'blank:<name>:<version>' to libs/<name>-<version>.jar, which is why the
    // artifact name is a property rather than a literal. Declared only when the file is present so a
    // fresh clone gets the compileJava guard's explanation instead of an unresolved-dependency error.
    if (customNpcsJar.exists()) {
        compileOnly fg.deobf("blank:${customnpcs_jar_artifact}:${customnpcs_jar_version}")
    }
    // Phase 7 dev-runtime (-PdevRuntime): load Iron's + its mandatory deps (GeckoLib/Curios/
    // PlayerAnimator) + Recruits at runtime so casting can actually run. runtimeOnly → never
    // shipped or committed; versions pinned to Iron's 3.15.x requirements. See docs/dev-runtime.md.
    // Easy NPC on its own (-PeasyNpcRuntime), without the Iron's stack. The full -PdevRuntime needs
    // several jars staged by hand in libs/; this boots Magic NPCs + Easy NPC from CurseMaven alone,
    // which is enough to prove the adapter, the diagnostics contributor and the compat guards
    // classload and register correctly. The casting hooks need Iron's and stay dormant here — which is
    // itself the "Easy NPC present, Iron's absent" case worth having a check for.
    if (project.hasProperty('easyNpcRuntime') && !project.hasProperty('devRuntime')) {
        runtimeOnly fg.deobf("curse.maven:${easy_npc_project}:${easy_npc_file}")
    }
    // CustomNPCs on its own (-PcustomNpcsRuntime), without the Iron's stack — same reasoning as
    // -PeasyNpcRuntime: enough to prove the compat facade, the API-bus bridge and the AI repair hook
    // classload and register against the real mod, with the casting hooks dormant.
    if (project.hasProperty('customNpcsRuntime') && !project.hasProperty('devRuntime')) {
        runtimeOnly fg.deobf("blank:${customnpcs_jar_artifact}:${customnpcs_jar_version}")
    }
    // LUMINOUS: BEASTS on its own or, more usefully, alongside -PdevRuntime (-PluminousRuntime).
    // Deliberately NOT excluded under devRuntime, unlike the two flags above: Luminous needs GeckoLib
    // and casting needs Iron's, both of which only -PdevRuntime stages, so the two are meant to be
    // combined. runtimeOnly → never compiled against, never shipped.
    if (project.hasProperty('luminousRuntime')) {
        runtimeOnly fg.deobf("curse.maven:${luminous_project}:${luminous_file}")
    }
    if (project.hasProperty('devRuntime')) {
        // Full Iron's runtime stack from local libs/ jars (the user's pack versions), so the
        // dev runtime matches production and needs no network for Iron's/GeckoLib/PlayerAnimator.
        // Curios resolves from the Gradle cache / Modrinth. runtimeOnly → never shipped/committed.
        runtimeOnly fg.deobf("blank:irons_spellbooks:${irons_spellbooks_runtime}") // libs/irons_spellbooks-1.20.1-3.16.1.jar
        runtimeOnly fg.deobf("blank:irons_lib:1.20.1-1.1.0")                        // libs/irons_lib-*.jar (Iron's 3.16.x split-out lib)
        runtimeOnly fg.deobf("blank:geckolib:4.8.3")                                // libs/geckolib-4.8.3.jar (Forge jar)
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
        runtimeOnly fg.deobf("blank:player-animation-lib-forge:1.0.2-rc1+1.20")     // libs/player-animation-lib-forge-*.jar
        runtimeOnly fg.deobf("blank:recruits:${recruits_jar_version}")              // libs/recruits-1.20.1-1.15.0.jar
        runtimeOnly fg.deobf("curse.maven:${easy_npc_project}:${easy_npc_file}")    // Easy NPC: Core
        runtimeOnly fg.deobf("blank:${customnpcs_jar_artifact}:${customnpcs_jar_version}") // libs/CustomNPCs-*.jar
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

// Build provenance. The 0.6.1 investigation could not tell which source produced the shipped binary,
// because the jar said nothing about itself beyond a version string that disagreed with the
// repository. Stamp the commit, the tree state and the build time into the manifest so a log line or
// an unzipped jar is enough to identify a build.
def gitDescribe = { ->
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
        }
        def sha = out.toString().trim()
        def dirty = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = dirty
            errorOutput = new ByteArrayOutputStream()
        }
        return dirty.toString().trim().isEmpty() ? sha : "${sha}-dirty"
    } catch (Exception ignored) {
        // A source zip with no .git is a legitimate way to build; say so rather than failing.
        return 'no-git'
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"    : mod_id,
                "Specification-Vendor"   : mod_authors,
                "Specification-Version"  : "1",
                "Implementation-Title"   : project.name,
                // "0.6.2+abc1234" / "0.6.2+abc1234-dirty" / "0.6.2+no-git": printed at startup and
                // reported by /magicnpcs config.
                "Implementation-Version" : "${project.version}+${gitDescribe()}",
                "Implementation-Vendor"  : mod_authors,
                "Implementation-Build-Date": new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
                // Two separate facts, deliberately two separate attributes. Neither is a behavioural
                // pass: "Compiled-Against" is the artifact javac saw (checkArtifactProvenance proves
                // the label matches the jar's own metadata), "Manifest-Reference" is the build the
                // shipped spell classifications were read from. The old single "Irons-Verified"
                // attribute conflated them and implied a verification that no build step performs.
                "MagicNPCs-Irons-Compiled-Against": project.findProperty('irons_spellbooks_compile') ?: 'unknown',
                "MagicNPCs-Irons-Manifest-Reference": project.findProperty('irons_spellbooks_manifest') ?: 'unknown'
        ])
    }
}

/**
 * Fail the build when the version in gradle.properties, the changelog's top heading and the mod
 * metadata disagree.
 *
 * The 0.6.1 release shipped as a jar whose version matched nothing in the repository, which is how a
 * whole release line became unreconstructable. A mismatch is cheap to catch here and expensive to
 * catch after publishing.
 */
tasks.register('checkVersionConsistency') {
    group = 'verification'
    description = 'Verify that gradle.properties, CHANGELOG.md and mods.toml agree on the version.'
    doLast {
        def changelog = file('CHANGELOG.md')
        if (!changelog.exists()) {
            throw new GradleException("CHANGELOG.md is missing; it is part of the release contract.")
        }
        def heading = changelog.readLines().find { it.startsWith('## ') }
        if (heading == null || !heading.contains(mod_version)) {
            throw new GradleException(
                    "CHANGELOG.md's first version heading (${heading}) does not mention mod_version " +
                    "${mod_version}. Update one of them before releasing.")
        }
        def toml = file('src/main/resources/META-INF/mods.toml').text
        if (!toml.contains('version="${version}"')) {
            throw new GradleException(
                    "mods.toml no longer takes its version from the Gradle build; it must stay " +
                    'version="${version}" so the two can never drift.')
        }
        logger.lifecycle("Version consistency OK: ${mod_version}")
    }
}

check.dependsOn tasks.named('checkVersionConsistency')

// -------------------------------------------------------------------------------------------------
// Dependency provenance (roadmap MN-001).
//
// 0.9.0 shipped a manifest attribute claiming the mod had been compiled against Iron's 1.20.1-3.16.3.
// The pinned CurseForge file id actually resolves to 1.20.1-3.15.0 - the label was written by hand and
// nothing ever compared it to the artifact. A hand-maintained label that nothing checks is exactly the
// class of fact that goes stale silently, so compare it against the jar's own metadata at build time.
// -------------------------------------------------------------------------------------------------

def sha256Of = { File f ->
    java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
}

/**
 * What a mod jar says about itself: the version in its own META-INF/mods.toml and the
 * Implementation-Version in its own manifest. Both are written by the mod's build, not by us.
 */
def jarSelfDescription = { File jar ->
    def described = [modsTomlVersion: null, implementationVersion: null, modId: null]
    new java.util.zip.ZipFile(jar).withCloseable { zip ->
        def toml = zip.getEntry('META-INF/mods.toml')
        if (toml != null) {
            def text = zip.getInputStream(toml).getText('UTF-8')
            def id = (text =~ /(?m)^\s*modId\s*=\s*"([^"]+)"/)
            if (id.find()) described.modId = id.group(1)
            def version = (text =~ /(?m)^\s*version\s*=\s*"([^"]+)"/)
            if (version.find()) described.modsTomlVersion = version.group(1)
        }
        def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
        if (manifestEntry != null) {
            zip.getInputStream(manifestEntry).withCloseable { stream ->
                described.implementationVersion =
                        new java.util.jar.Manifest(stream).mainAttributes.getValue('Implementation-Version')
            }
        }
    }
    return described
}

/**
 * The ORIGINAL published Iron's artifact, resolved without fg.deobf.
 *
 * What lands on compileClasspath is a remapped derivative: ForgeGradle rewrites it into the workspace
 * mappings, so its bytes - and therefore its SHA-256 - are ours, not the publisher's. Provenance has to
 * be established against the artifact as published; the derivative is recorded separately and never
 * treated as the identity of the dependency.
 */
def originalIronsArtifact = { ->
    def coordinate = "curse.maven:${irons_spellbooks_project}:${irons_spellbooks_file}"
    def detached = configurations.detachedConfiguration(dependencies.create(coordinate))
    detached.transitive = false
    return detached.singleFile
}

def remappedIronsArtifact = { ->
    return configurations.compileClasspath.files.find {
        it.name.startsWith("${irons_spellbooks_project}-${irons_spellbooks_file}")
    }
}

tasks.register('checkArtifactProvenance') {
    group = 'verification'
    description = "Verify that every declared dependency label matches the artifact's own metadata."
    doLast {
        def problems = []
        def report = []

        // --- Iron's: the declared compile label against the published jar's own metadata ------------
        def declared = (project.findProperty('irons_spellbooks_compile') ?: 'unknown').toString()
        def original = originalIronsArtifact()
        def described = jarSelfDescription(original)
        report << "Iron's Spells 'n Spellbooks"
        report << "  coordinate           curse.maven:${irons_spellbooks_project}:${irons_spellbooks_file}"
        report << "  original artifact    ${original.name}"
        report << "  original sha256      ${sha256Of(original)}"
        report << "  mods.toml modId      ${described.modId}"
        report << "  mods.toml version    ${described.modsTomlVersion}"
        report << "  manifest version     ${described.implementationVersion}"
        report << "  declared compile     ${declared}"

        def remapped = remappedIronsArtifact()
        if (remapped != null) {
            report << "  remapped derivative  ${remapped.name} (workspace mappings; not the published bytes)"
            report << "  derivative sha256    ${sha256Of(remapped)}"
        }

        if (described.modsTomlVersion == null) {
            problems << "The resolved Iron's artifact declares no version in its META-INF/mods.toml."
        } else if (described.modsTomlVersion != declared) {
            problems << "irons_spellbooks_compile says '${declared}', but file id ${irons_spellbooks_file} " +
                    "resolves to an artifact whose own mods.toml says '${described.modsTomlVersion}'."
        }
        if (described.implementationVersion != null && described.implementationVersion != declared) {
            problems << "irons_spellbooks_compile says '${declared}', but the resolved artifact's manifest " +
                    "Implementation-Version is '${described.implementationVersion}'."
        }
        if (described.modId != null && described.modId != 'irons_spellbooks') {
            problems << "The artifact behind file id ${irons_spellbooks_file} declares modId " +
                    "'${described.modId}', not 'irons_spellbooks'."
        }

        // --- Runtime companion: only checkable when the dev-runtime jar is actually staged ----------
        def runtimeIrons = file("libs/irons_spellbooks-${irons_spellbooks_runtime}.jar")
        if (runtimeIrons.exists()) {
            def runtimeDescribed = jarSelfDescription(runtimeIrons)
            report << "  dev-runtime jar      ${runtimeIrons.name} (mods.toml ${runtimeDescribed.modsTomlVersion})"
            report << "  dev-runtime sha256   ${sha256Of(runtimeIrons)}"
            if (runtimeDescribed.modsTomlVersion != null
                    && runtimeDescribed.modsTomlVersion != irons_spellbooks_runtime) {
                problems << "irons_spellbooks_runtime says '${irons_spellbooks_runtime}', but " +
                        "${runtimeIrons.name} declares '${runtimeDescribed.modsTomlVersion}'."
            }
        } else {
            report << "  dev-runtime jar      not staged (-PdevRuntime unavailable; not an error here)"
        }

        // --- CustomNPCs: the pinned hash stays authoritative ----------------------------------------
        report << "CustomNPCs (GBPort unofficial)"
        if (customNpcsJar.exists()) {
            def actual = sha256Of(customNpcsJar)
            def describedNpcs = jarSelfDescription(customNpcsJar)
            report << "  local artifact       ${customNpcsJar.name}"
            report << "  sha256               ${actual}"
            report << "  mods.toml version    ${describedNpcs.modsTomlVersion}"
            report << "  pinned sha256        ${customnpcs_jar_sha256}"
            if (actual != customnpcs_jar_sha256) {
                problems << "The CustomNPCs jar in libs/ hashes to ${actual}, not the pinned " +
                        "${customnpcs_jar_sha256}."
            }
        } else {
            problems << "libs/${customNpcsJar.name} is missing; its pinned hash cannot be verified."
        }

        // --- Recruits ------------------------------------------------------------------------------
        report << "Villager Recruits"
        if (recruitsJar.exists()) {
            report << "  local artifact       ${recruitsJar.name}"
            report << "  sha256               ${sha256Of(recruitsJar)}"
            report << "  mods.toml version    ${jarSelfDescription(recruitsJar).modsTomlVersion}"
        } else {
            problems << "libs/${recruitsJar.name} is missing; its provenance cannot be recorded."
        }

        // --- Nothing may become a bundled dependency -------------------------------------------------
        // Every optional mod here is compileOnly or runtimeOnly on purpose (three of the four are All
        // Rights Reserved). A stray 'implementation' would ship them inside our jar.
        ['implementation', 'api'].each { name ->
            def configuration = configurations.findByName(name)
            if (configuration == null) {
                return
            }
            configuration.dependencies.each { dependency ->
                if (dependency.group == 'curse.maven' || dependency.group == 'blank'
                        || dependency.group == 'maven.modrinth') {
                    problems << "${dependency.group}:${dependency.name} is declared on '${name}', which " +
                            "would bundle it into the mod jar. Optional mods stay compileOnly/runtimeOnly."
                }
            }
        }

        def reportFile = file("${buildDir}/reports/provenance/artifacts.txt")
        reportFile.parentFile.mkdirs()
        reportFile.text = report.join('\n') + '\n'
        logger.lifecycle(report.join('\n'))
        logger.lifecycle("Provenance report: ${reportFile}")

        if (!problems.isEmpty()) {
            throw new GradleException("Artifact provenance check failed:\n  - " + problems.join('\n  - '))
        }
        logger.lifecycle('Artifact provenance OK.')
    }
}

check.dependsOn tasks.named('checkArtifactProvenance')

/**
 * The §1 baseline the roadmap asks a release to be reconstructable from: checkout identity, toolchain,
 * resolved compile graph and the hash of every local jar. Written to a file rather than only logged so
 * it can be attached to a release record.
 */
tasks.register('writeBuildBaselineReport') {
    group = 'verification'
    description = 'Record checkout, toolchain, resolved dependencies and local JAR hashes.'
    doLast {
        def lines = []
        lines << "magicnpcs ${mod_version} build baseline"
        lines << "generated             ${new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))}"
        lines << "checkout              ${gitDescribe()}"
        lines << "minecraft/forge       ${minecraft_version} / ${forge_version}"
        lines << "java toolchain        ${java.toolchain.languageVersion.get()}"
        lines << "gradle                ${gradle.gradleVersion}"
        lines << ''
        lines << 'compileClasspath (resolved)'
        configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { "  ${it.moduleVersion.id} -> ${it.file.name}" }
                .sort()
                .each { lines << it }
        lines << ''
        lines << 'libs/'
        def libs = file('libs').listFiles()?.findAll { it.name.endsWith('.jar') }?.sort { it.name } ?: []
        if (libs.isEmpty()) {
            lines << '  (none staged)'
        }
        libs.each { lines << "  ${it.name}  sha256=${sha256Of(it)}" }

        def reportFile = file("${buildDir}/reports/provenance/baseline.txt")
        reportFile.parentFile.mkdirs()
        reportFile.text = lines.join('\n') + '\n'
        logger.lifecycle("Build baseline: ${reportFile}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// The Recruits adapter and its GameTest support compile against com.talhanation.recruits, so the jar
// has to be present. Say that plainly at the point of failure — without this the build stops with an
// opaque "Could not resolve blank:recruits" that says nothing about where the file goes.
tasks.named('compileJava').configure {
    doFirst {
        if (!recruitsJar.exists()) {
            throw new GradleException("""
Missing the Villager Recruits jar, which Magic NPCs compiles against (compileOnly - it is never
bundled, and it is All Rights Reserved so it is not committed to this repository).

  Expected: ${recruitsJar}

Drop that exact file into libs/ (the version is pinned by 'recruits_jar_version' in
gradle.properties) and build again. Do NOT substitute a hand-written stub: the emitted call
descriptors would silently disagree with the real mod at runtime.
""".stripIndent())
        }
        if (!customNpcsJar.exists()) {
            throw new GradleException("""
Missing the CustomNPCs jar, which Magic NPCs compiles against (compileOnly - it is never bundled).
This is the GBPort community build for 1.20.1; it is not published to any Maven repository, so it
cannot be fetched automatically and it is not committed to this repository.

  Expected: ${customNpcsJar}

Drop that exact file into libs/ (the artifact name and version are pinned by
'customnpcs_jar_artifact' / 'customnpcs_jar_version' in gradle.properties) and build again. Do NOT
substitute a hand-written stub: the emitted call descriptors would silently disagree with the real
mod at runtime.
""".stripIndent())
        }
        // Several rehosts publish a jar with this exact file name. Compiling against the wrong one
        // produces a build that only fails once a player loads a world, so check it here instead.
        if (customnpcs_jar_sha256) {
            def actual = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(customNpcsJar.bytes)
                    .encodeHex().toString()
            if (actual != customnpcs_jar_sha256) {
                throw new GradleException("""
The CustomNPCs jar in libs/ is not the build Magic NPCs is pinned to.

  File:     ${customNpcsJar}
  Expected: ${customnpcs_jar_sha256}
  Actual:   ${actual}

Either replace it with the pinned build, or - if you deliberately mean to compile against a
different one - update 'customnpcs_jar_sha256' (and the version) in gradle.properties and re-check
CustomNpcsCompat.SUPPORTED_VERSIONS, which is what decides at runtime whether the bridge activates.
""".stripIndent())
            }
        }
    }
}

// -------------------------------------------------------------------------------------------------
// Honest positive integration profiles (roadmap MN-P0.3, MN-P0.4 / MN-015).
//
// Through 0.9.0 every integration GameTest opened with "if the host mod is absent, succeed". That is
// correct for the offline smoke run and actively misleading for a run that is meant to prove an
// integration works: a completely green report was indistinguishable from a report where nothing ran.
// The two are now separate things. No profile selected = absence smoke tests, unchanged. A selected
// profile names the mods that MUST be present; its preflight fails before the server starts if they
// are not, and every test needing one of them fails instead of skipping.
// -------------------------------------------------------------------------------------------------

/**
 * Profile name -> the mod ids a run of that profile must actually load. Declared explicitly rather
 * than derived from the -P runtime flags: a flag says what Gradle was asked to stage, and the point of
 * a preflight is to check what is really there.
 */
def positiveProfileTable() {
    return [
            // The compile floor: Iron's alone, at the version the mod is compiled against.
            'irons-floor'     : ['irons_spellbooks'],
            // The full development stack (-PdevRuntime): Iron's + Recruits + Easy NPC + CustomNPCs.
            'irons-dev'       : ['irons_spellbooks', 'recruits', 'easy_npc', 'customnpcs'],
            // Iron's at the build the shipped spell manifest was classified against.
            'irons-manifest'  : ['irons_spellbooks'],
            'irons-easy'      : ['irons_spellbooks', 'easy_npc'],
            'irons-customnpcs': ['irons_spellbooks', 'customnpcs'],
            'irons-recruits'  : ['irons_spellbooks', 'recruits'],
            // Everything at once, for the combined acceptance run.
            'combined'        : ['irons_spellbooks', 'recruits', 'easy_npc', 'customnpcs'],
    ]
}

/**
 * @return the selected profile name. {@code -PpositiveIntegration=<name>} is accepted as an alias of
 *         {@code -PtestRuntimeProfile=<name>} so the two documented spellings agree.
 */
def selectedPositiveProfile() {
    def name = project.findProperty('testRuntimeProfile') ?: project.findProperty('positiveIntegration')
    return name == null ? null : name.toString()
}

def selectedPositiveProfileMods() {
    def name = selectedPositiveProfile()
    def mods = positiveProfileTable()[name]
    if (mods == null) {
        throw new GradleException("Unknown positive integration profile '${name}'. Known profiles: "
                + positiveProfileTable().keySet().join(', '))
    }
    return mods
}

/**
 * Which local jar a required mod id is staged from, when it is staged from libs/ at all. Iron's and
 * Easy NPC come from CurseMaven under -PdevRuntime, so their absence cannot be detected from the file
 * system; the in-game preflight catches those.
 */
def requiredLocalJarFor(String modId) {
    switch (modId) {
        case 'recruits': return file("libs/recruits-${recruits_jar_version}.jar")
        case 'customnpcs': return file("libs/${customnpcs_jar_artifact}-${customnpcs_jar_version}.jar")
        case 'irons_spellbooks': return file("libs/irons_spellbooks-${irons_spellbooks_runtime}.jar")
        default: return null
    }
}

/**
 * Everything checkable before the server boots: the profile name, the runtime flags that stage it, and
 * the local jars it needs. The remaining half of the preflight - "did the mod actually load, and does
 * the entity/API it needs exist" - can only be answered in-game and is answered by
 * {@code com.otectus.magicnpcs.gametest.PositiveProfile}.
 */
tasks.register('checkPositiveGameTestPreflight') {
    group = 'verification'
    description = 'Fail before a positive integration run if its required dependencies are not staged.'
    doLast {
        def profile = selectedPositiveProfile()
        if (profile == null) {
            throw new GradleException("No positive profile selected. Pass -PtestRuntimeProfile=<name>; "
                    + "known profiles: " + positiveProfileTable().keySet().join(', '))
        }
        def required = selectedPositiveProfileMods()
        def problems = []

        // A negative fixture for the preflight itself (REG-35): prove that a missing required jar
        // fails the profile for that specific reason, without having to delete a real dependency.
        if (project.findProperty('positivePreflightSelfTest') == 'missing-jar') {
            problems << "required mod 'magicnpcs_test_absent' is staged from " +
                    "libs/magicnpcs_test_absent-0.0.0.jar, which does not exist"
        }

        if (required.contains('irons_spellbooks') && !project.hasProperty('devRuntime')) {
            problems << "profile '${profile}' requires Iron's at runtime, which only -PdevRuntime stages"
        }
        required.each { modId ->
            def jar = requiredLocalJarFor(modId)
            if (jar != null && !jar.exists()) {
                problems << "required mod '${modId}' is staged from ${jar}, which does not exist"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Positive profile '${profile}' cannot run:\n  - "
                    + problems.join('\n  - ')
                    + "\n\nThis is a preflight failure, not a test result: nothing ran. Stage the "
                    + "dependencies (docs/dev-runtime.md) or select a different profile.")
        }
        logger.lifecycle("Positive profile '${profile}' preflight OK; required mods: ${required.join(', ')}")
    }
}

/**
 * Run the GameTests under a required-positive profile and reject a green result that did not actually
 * exercise the positive path.
 *
 * <p>The in-game side writes executed/skipped/failed counts plus the name of every skipped positive
 * test; this reads them back. A run in which every positive test skipped is a failure here, which is
 * precisely the hole MN-015 recorded.
 */
tasks.register('verifyPositiveGameTests') {
    group = 'verification'
    description = 'Run the GameTests under a required-positive profile and verify the positive path ran.'
    dependsOn tasks.named('checkPositiveGameTestPreflight')
    dependsOn tasks.named('runGameTestServer')
    doLast {
        def profile = selectedPositiveProfile()
        def reportFile = file("${buildDir}/reports/gametest/positive-profile.properties")
        if (!reportFile.exists()) {
            throw new GradleException("Positive profile '${profile}' produced no report at ${reportFile}. "
                    + "The run did not reach the GameTest harness, so nothing is verified.")
        }
        def report = new Properties()
        reportFile.withInputStream { report.load(it) }

        def executed = (report.getProperty('executed') ?: '0') as int
        def skipped = (report.getProperty('skipped') ?: '0') as int
        def failed = (report.getProperty('failed') ?: '0') as int
        def skippedPositive = report.getProperty('skippedPositive') ?: ''
        logger.lifecycle("Positive profile '${profile}': executed=${executed} skipped=${skipped} "
                + "failed=${failed}")

        def problems = []
        if (report.getProperty('profile') != profile) {
            problems << "the report was written by profile '${report.getProperty('profile')}', not '${profile}'"
        }
        if (executed == 0) {
            problems << 'no positive test executed at all'
        }
        if (failed > 0) {
            problems << "${failed} test(s) failed: ${report.getProperty('failures') ?: 'see the run log'}"
        }
        if (!skippedPositive.isEmpty()) {
            problems << "these tests skipped their positive path: ${skippedPositive}"
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Positive profile '${profile}' is not verified:\n  - "
                    + problems.join('\n  - '))
        }
        logger.lifecycle("Positive profile '${profile}' verified: ${executed} executed, 0 skipped positive.")
    }
}
